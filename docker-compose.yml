services:
  postgres:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: devops
    ports:
      - "5432:5432"
  django:
    build: 
      dockerfile: Dockerfile
      context: .
    environment:
      SECRET_KEY: "secret"
      DB_HOST: "postgres"
      APP_ENVIRONMENT: "production"
    ports:
      - "8000:8000"
